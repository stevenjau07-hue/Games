<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10211c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dama: Checkers vs AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Dama</h1>
  <p class="sub">Checkers against an AI that works fully offline.</p>
  <div class="bar">
    <label>Level <select id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
    <button class="act" id="new">New game</button>
    <button class="act" id="install" hidden>Install app</button>
  </div>
  <div id="status" role="status"></div>
  <div id="board"></div>
  <p id="stats" class="stats"></p>
</main>
<script src="game.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
